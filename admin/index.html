<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalChat Admin</title><link rel="stylesheet" href="style.css"></head><body><main><h1>GlobalChat Admin</h1><p class="warning">DEMO ONLY: this static admin page asks for an API key in the browser. Do not publish it publicly for production. Replace with proper admin login and server-issued sessions.</p><label>Admin API key <input id="key" type="password" autocomplete="off"></label><button id="load">Load dashboard</button><p id="message"></p><section id="stats" hidden><h2>Service statistics</h2><pre id="statsOutput"></pre><h2>Remote in-app configuration</h2><label>App name <input id="appName" maxlength="40"></label><label>Primary color <input id="primaryColor" value="#315CFF" pattern="#[0-9A-Fa-f]{6}"></label><label>Announcement <textarea id="announcement" maxlength="300"></textarea></label><button id="save">Save configuration</button><p id="saveMessage"></p></section></main><script src="config.js"></script><script src="app.js"></script></body></html>
